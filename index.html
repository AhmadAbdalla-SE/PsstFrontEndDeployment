<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psst — say it anonymously</title>
    <meta
      name="description"
      content="Psst lets anyone drop you an anonymous message. Ask who sent it, and if they say yes, keep talking."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One variable font covering the whole 400-900 range, instead of seven
      static weights plus an italic that nothing in the app ever used. Asking
      for a RANGE (400..900) is what makes Google serve the variable file:
      listing weights individually returns a separate file for each.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
